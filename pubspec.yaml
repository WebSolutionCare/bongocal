name: bongocal
description: A premium Bangla calendar for Bangladesh — three calendars, one place.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Dates / calendars
  hijri: ^3.0.0
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Location (for prayer times)
  geolocator: ^12.0.0

  # Prayer time calculation
  adhan_dart: ^2.0.0-nullsafety.2

  # Fonts (Hind Siliguri + Inter)
  google_fonts: ^6.2.1

  # SVG / icon assets
  flutter_svg: ^2.0.10+1

  # Functional types (Either<Failure, T>)
  dartz: ^0.10.1

  # Value equality
  equatable: ^2.0.5

  # IDs
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

  # Lints for Riverpod
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/data/
