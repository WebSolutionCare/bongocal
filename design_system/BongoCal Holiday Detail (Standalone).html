document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  --brand-gold:           #D4AF37;   /* Premium / festival */\n  --brand-gold-700:       #A8881C;\n  --brand-gold-100:       #F5EBC4;\n  --brand-gold-50:        #FBF6E1;\n\n  /* === Neutrals (warm-leaning) ========================== */\n  --gray-50:   #FAFAF8;\n  --gray-100:  #F4F4F1;\n  --gray-200:  #E8E8E3;\n  --gray-300:  #D4D4CC;\n  --gray-400:  #A8A89E;\n  --gray-500:  #767670;\n  --gray-600:  #535350;\n  --gray-700:  #3A3A38;\n  --gray-800:  #232322;\n  --gray-900:  #141413;\n\n  /* === Semantic (status) ================================ */\n  --success:        #1F8A4C;\n  --success-tint:   #DBEFE2;\n  --warning:        #C97A11;\n  --warning-tint:   #FAEBCD;\n  --error:          #D02D2D;\n  --error-tint:     #F9DCDC;\n  --info:           #1E6FBE;\n  --info-tint:      #DDEAF8;\n\n  /* === Festival accents ================================= */\n  --festival-eid:           #D4AF37;   /* Eid gold */\n  --festival-boishakh:      #E63946;   /* Pohela Boishakh red */\n  --festival-independence:  #006A4E;   /* Independence green */\n  --festival-victory:       #B5172A;   /* Victory Day deep red */\n  --festival-puja:          #E07A1F;   /* Durga Puja saffron */\n\n  /* === Roles (LIGHT) ==================================== */\n  --bg-canvas:       #FAFAF8;\n  --bg-surface:      #FFFFFF;\n  --bg-surface-2:    #F4F4F1;\n  --bg-elevated:     #FFFFFF;\n  --bg-scrim:        rgba(20,20,19, 0.45);\n\n  --fg-primary:      #141413;\n  --fg-secondary:    #535350;\n  --fg-tertiary:     #767670;\n  --fg-on-brand:     #FFFFFF;\n  --fg-on-gold:      #1A1A18;\n\n  --border-subtle:   rgba(20,20,19, 0.08);\n  --border-default:  rgba(20,20,19, 0.14);\n  --border-strong:   rgba(20,20,19, 0.22);\n\n  /* === Type families ==================================== */\n  --font-bangla: 'Hind Siliguri', system-ui, sans-serif;\n  --font-latin:  'Inter', system-ui, -apple-system, sans-serif;\n\n  /* === Type scale ======================================= */\n  --fs-display:    40px;   --lh-display:    48px;   --tr-display:    -0.015em;\n  --fs-h1:         28px;   --lh-h1:         34px;   --tr-h1:         -0.010em;\n  --fs-h2:         22px;   --lh-h2:         28px;   --tr-h2:         -0.005em;\n  --fs-h3:         18px;   --lh-h3:         24px;   --tr-h3:         -0.0025em;\n  --fs-body:       16px;   --lh-body:       24px;\n  --fs-body-sm:    14px;   --lh-body-sm:    20px;\n  --fs-caption:    12px;   --lh-caption:    16px;   --tr-caption:    0.005em;\n\n  /* === Spacing (4px base) =============================== */\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-6:   24px;\n  --space-8:   32px;\n  --space-12:  48px;\n  --space-16:  64px;\n\n  /* === Radii ============================================ */\n  --radius-xs:    4px;\n  --radius-sm:    8px;\n  --radius-md:    12px;\n  --radius-lg:    16px;\n  --radius-xl:    20px;\n  --radius-pill:  999px;\n\n  /* === Shadows (warm-tinted, 4 levels) ================== */\n  --shadow-xs: 0 1px 2px rgba(20,20,19, 0.05);\n  --shadow-sm: 0 1px 2px rgba(20,20,19, 0.04), 0 2px 6px rgba(20,20,19, 0.06);\n  --shadow-md: 0 2px 4px rgba(20,20,19, 0.05), 0 8px 20px rgba(20,20,19, 0.10);\n  --shadow-lg: 0 4px 8px rgba(20,20,19, 0.06), 0 18px 40px rgba(20,20,19, 0.16);\n\n  /* === Motion =========================================== */\n  --ease-standard:  cubic-bezier(0.2, 0, 0, 1);\n  --ease-spring:    cubic-bezier(0.32, 0.72, 0, 1);\n  --dur-hover:      120ms;\n  --dur-press:       80ms;\n  --dur-page:       180ms;\n  --dur-sheet-in:   280ms;\n  --dur-sheet-out:  220ms;\n}\n\n[data-theme=\"dark\"] {\n  --bg-canvas:       #0E0E0D;\n  --bg-surface:      #1A1A18;\n  --bg-surface-2:    #232322;\n  --bg-elevated:     #2A2A28;\n  --bg-scrim:        rgba(0,0,0, 0.6);\n\n  --fg-primary:      #F4F4F1;\n  --fg-secondary:    #B8B8B0;\n  --fg-tertiary:     #8A8A82;\n  --fg-on-brand:     #FFFFFF;\n  --fg-on-gold:      #1A1A18;\n\n  --border-subtle:   rgba(255,255,255, 0.08);\n  --border-default:  rgba(255,255,255, 0.14);\n  --border-strong:   rgba(255,255,255, 0.22);\n\n  --brand-emerald-100: #133D31;\n  --brand-emerald-50:  #0F2B23;\n  --brand-red-100:     #3D1117;\n  --brand-red-50:      #2A0C10;\n  --brand-gold-100:    #3D3318;\n  --brand-gold-50:     #2A240F;\n\n  --success-tint:   #143D24;\n  --warning-tint:   #3D2A0E;\n  --error-tint:     #3D1414;\n  --info-tint:      #142A3D;\n\n  --shadow-xs: 0 1px 2px rgba(0,0,0, 0.4);\n  --shadow-sm: 0 1px 2px rgba(0,0,0, 0.3), 0 2px 6px rgba(0,0,0, 0.4);\n  --shadow-md: 0 2px 4px rgba(0,0,0, 0.4), 0 8px 20px rgba(0,0,0, 0.5);\n  --shadow-lg: 0 4px 8px rgba(0,0,0, 0.4), 0 18px 40px rgba(0,0,0, 0.6);\n}\n\n/* === Semantic type roles ================================ */\n.t-display, [data-type=\"display\"] {\n  font-size: var(--fs-display); line-height: var(--lh-display);\n  letter-spacing: var(--tr-display); font-weight: 700;\n}\n.t-h1, [data-type=\"h1\"] {\n  font-size: var(--fs-h1); line-height: var(--lh-h1);\n  letter-spacing: var(--tr-h1); font-weight: 600;\n}\n.t-h2, [data-type=\"h2\"] {\n  font-size: var(--fs-h2); line-height: var(--lh-h2);\n  letter-spacing: var(--tr-h2); font-weight: 600;\n}\n.t-h3, [data-type=\"h3\"] {\n  font-size: var(--fs-h3); line-height: var(--lh-h3);\n  letter-spacing: var(--tr-h3); font-weight: 600;\n}\n.t-body, [data-type=\"body\"] {\n  font-size: var(--fs-body); line-height: var(--lh-body); font-weight: 400;\n}\n.t-body-sm, [data-type=\"body-sm\"] {\n  font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); font-weight: 400;\n}\n.t-caption, [data-type=\"caption\"] {\n  font-size: var(--fs-caption); line-height: var(--lh-caption);\n  letter-spacing: var(--tr-caption); font-weight: 500;\n  text-transform: uppercase;\n}\n\n.font-bangla { font-family: var(--font-bangla); }\n.font-latin  { font-family: var(--font-latin); }\n<\u002Fstyle>\n  \n  <style>\n    * { box-sizing: border-box; }\n    html, body { margin: 0; padding: 0; min-height: 100vh; background: #EDEDE7; color: var(--fg-primary); }\n    body { font-family: var(--font-bangla); padding: 56px 32px 80px; display: flex; flex-direction: column; align-items: center; gap: 28px; }\n    .header { text-align: center; max-width: 760px; }\n    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #767670; text-transform: uppercase; font-family: var(--font-latin); }\n    .title { font-family: var(--font-latin); font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-top: 10px; color: #141413; }\n    .sub { font-family: var(--font-latin); font-size: 15px; color: #535350; margin-top: 8px; line-height: 1.5; }\n    .row { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }\n    .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }\n    .label { font-family: var(--font-latin); font-size: 11px; font-weight: 700; color: #767670; letter-spacing: 0.10em; text-transform: uppercase; }\n\n    .device { width: 390px; height: 844px; background: var(--bg-canvas); border-radius: 50px; border: 10px solid #1A1A18; box-shadow: 0 6px 12px rgba(20,20,19,.10), 0 30px 60px rgba(20,20,19,.20); overflow: hidden; position: relative; }\n    .device.dark { border-color: #000; }\n    .island { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 110px; height: 32px; background: #000; border-radius: 999px; z-index: 60; }\n    .home-bar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 999px; background: var(--fg-primary); opacity: 0.4; z-index: 50; }\n    .scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding-bottom: 110px; }\n    .scroll::-webkit-scrollbar { display: none; }\n\n    /* status bar over hero */\n    .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 47px; padding: 16px 30px 0; display: flex; align-items: center; justify-content: space-between; font-family: var(--font-latin); font-size: 15px; font-weight: 600; color: #fff; z-index: 50; pointer-events: none; }\n\n    /* ============ HERO ============ */\n    .hero {\n      position: relative; height: 440px; overflow: hidden;\n      color: #fff;\n    }\n    /* Boishakh-themed illustration: alpana radial + sun + paisleys, in red/gold */\n    .hero-illu {\n      position: absolute; inset: 0;\n      background:\n        radial-gradient(circle at 50% 28%, #FDB52A 0%, #F26A2E 30%, #C71F33 65%, #6E1018 100%);\n    }\n    .hero-illu::before {\n      /* concentric paisley/alpana rings */\n      content: \"\"; position: absolute; left: 50%; top: 28%; transform: translate(-50%,-50%);\n      width: 520px; height: 520px; border-radius: 999px;\n      background:\n        repeating-radial-gradient(circle at center,\n          rgba(255,255,255,0.0) 0 28px,\n          rgba(255,255,255,0.10) 28px 30px,\n          rgba(255,255,255,0.0) 30px 60px,\n          rgba(255,255,255,0.06) 60px 62px);\n      mask: radial-gradient(circle at center, #000 60%, transparent 75%);\n    }\n    .hero-illu::after {\n      /* warm vignette to bottom for legibility */\n      content: \"\"; position: absolute; inset: 0;\n      background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(20,8,8,0.0) 50%, rgba(20,8,8,0.55) 90%, rgba(20,8,8,0.85) 100%);\n    }\n    /* sun rays SVG layer */\n    .hero-rays { position: absolute; left: 50%; top: 16%; transform: translate(-50%,0); opacity: 0.55; }\n    .hero-petals { position: absolute; left: 50%; top: 28%; transform: translate(-50%,-50%); opacity: 0.35; mix-blend-mode: overlay; }\n\n    .hero-top {\n      position: absolute; top: 56px; left: 0; right: 0; padding: 0 16px; z-index: 20;\n      display: flex; justify-content: space-between; align-items: center;\n    }\n    .icon-btn {\n      width: 36px; height: 36px; border-radius: 999px;\n      background: rgba(255,255,255,0.18); backdrop-filter: blur(10px);\n      border: 0; color: #fff; cursor: pointer;\n      display: inline-flex; align-items: center; justify-content: center;\n    }\n    .icon-btn svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n\n    .hero-foot {\n      position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 22px 26px;\n      z-index: 20;\n    }\n    .badge {\n      display: inline-flex; align-items: center; gap: 6px;\n      padding: 5px 10px 5px 8px; border-radius: 999px;\n      background: rgba(255,255,255,0.18); backdrop-filter: blur(10px);\n      font-family: var(--font-bangla); font-size: 11px; font-weight: 600; color: #fff;\n      border: 1px solid rgba(255,255,255,0.25);\n    }\n    .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: #fff; }\n    .h-name {\n      font-family: var(--font-bangla); font-size: 38px; font-weight: 700;\n      line-height: 1.05; letter-spacing: -0.01em; margin-top: 12px;\n      text-shadow: 0 2px 12px rgba(0,0,0,0.35);\n    }\n    .h-name-en {\n      font-family: var(--font-latin); font-size: 14px; font-weight: 500;\n      opacity: 0.85; margin-top: 6px; letter-spacing: 0.005em;\n    }\n    .h-dates {\n      display: flex; gap: 14px; align-items: baseline; margin-top: 14px;\n    }\n    .h-date-bn {\n      font-family: var(--font-bangla); font-size: 16px; font-weight: 600;\n    }\n    .h-date-en {\n      font-family: var(--font-latin); font-size: 13px; font-weight: 500; opacity: 0.85;\n      padding-left: 14px; border-left: 1px solid rgba(255,255,255,0.35);\n    }\n\n    /* ============ COUNTDOWN ============ */\n    .countdown {\n      margin: -40px 16px 0; position: relative; z-index: 30;\n      background: var(--bg-surface); border-radius: 22px;\n      box-shadow: 0 12px 32px rgba(20,20,19,0.18), 0 1px 0 rgba(255,255,255,0.5) inset;\n      padding: 16px 18px;\n      display: flex; align-items: center; gap: 14px;\n      border: 1px solid var(--border-subtle);\n    }\n    .cd-pulse {\n      width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px;\n      background: var(--brand-red-50); color: var(--festival-boishakh);\n      display: inline-flex; align-items: center; justify-content: center;\n      position: relative;\n    }\n    .cd-pulse svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n    .cd-pulse::after {\n      content: \"\"; position: absolute; inset: -3px; border-radius: 999px;\n      border: 2px solid var(--festival-boishakh); opacity: 0;\n      animation: pulse-ring 2.5s ease-out infinite;\n    }\n    @keyframes pulse-ring {\n      0% { opacity: 0.6; transform: scale(0.85); }\n      100% { opacity: 0; transform: scale(1.4); }\n    }\n    .cd-text { flex: 1; min-width: 0; }\n    .cd-num {\n      font-family: var(--font-latin); font-size: 26px; font-weight: 700; color: var(--fg-primary);\n      letter-spacing: -0.015em; line-height: 1;\n      display: inline-flex; align-items: baseline; gap: 6px;\n    }\n    .cd-num .unit {\n      font-family: var(--font-bangla); font-size: 14px; font-weight: 600; color: var(--fg-secondary);\n      letter-spacing: 0;\n    }\n    .cd-sub {\n      font-family: var(--font-bangla); font-size: 12px; color: var(--fg-tertiary); margin-top: 4px;\n    }\n    .cd-progress {\n      width: 56px; height: 56px; flex-shrink: 0; position: relative;\n    }\n    .cd-progress svg { width: 100%; height: 100%; transform: rotate(-90deg); }\n    .cd-progress .track { stroke: var(--border-subtle); }\n    .cd-progress .fill {\n      stroke: var(--festival-boishakh);\n      stroke-dasharray: 150.8;\n      stroke-dashoffset: 33;\n      transition: stroke-dashoffset 1s var(--ease-spring);\n    }\n    .cd-progress-pct {\n      position: absolute; inset: 0; display: inline-flex; align-items: center; justify-content: center;\n      font-family: var(--font-latin); font-size: 11px; font-weight: 700; color: var(--fg-secondary);\n    }\n\n    /* ============ ACTIONS ============ */\n    .actions {\n      margin: 14px 16px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;\n    }\n    .action {\n      background: var(--bg-surface); border: 1px solid var(--border-subtle);\n      border-radius: 14px; padding: 12px 8px;\n      display: flex; flex-direction: column; align-items: center; gap: 6px;\n      cursor: pointer; transition: all 120ms var(--ease-standard);\n    }\n    .action:hover { background: var(--bg-surface-2); }\n    .action.primary {\n      background: var(--brand-emerald-50); border-color: transparent;\n    }\n    .action .ic {\n      width: 32px; height: 32px; border-radius: 999px;\n      background: var(--bg-surface-2); color: var(--fg-secondary);\n      display: inline-flex; align-items: center; justify-content: center;\n    }\n    .action.primary .ic { background: var(--brand-emerald); color: #fff; }\n    .action .ic svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n    .action .ic.filled svg { fill: currentColor; stroke: none; }\n    .action .lbl {\n      font-family: var(--font-bangla); font-size: 12px; font-weight: 500; color: var(--fg-primary);\n    }\n\n    /* ============ SECTIONS ============ */\n    .sec { padding: 0 22px; margin-top: 26px; }\n    .sec-title {\n      font-family: var(--font-bangla); font-size: 18px; font-weight: 700; color: var(--fg-primary);\n      letter-spacing: -0.005em; margin: 0 0 12px;\n      display: flex; align-items: center; gap: 8px;\n    }\n    .sec-title .accent {\n      width: 3px; height: 16px; border-radius: 2px; background: var(--festival-boishakh);\n    }\n\n    .lede {\n      font-family: var(--font-bangla); font-size: 16px; line-height: 1.7; color: var(--fg-primary);\n      margin: 0 0 14px;\n      text-wrap: pretty;\n    }\n    .lede::first-letter {\n      font-family: var(--font-bangla); font-size: 44px; font-weight: 700;\n      color: var(--festival-boishakh);\n      float: left; line-height: 1; padding: 4px 8px 0 0;\n    }\n    .body-p {\n      font-family: var(--font-bangla); font-size: 14px; line-height: 1.75; color: var(--fg-secondary);\n      margin: 0 0 12px;\n      text-wrap: pretty;\n    }\n    .pull-quote {\n      margin: 16px 0;\n      padding: 14px 16px;\n      border-left: 3px solid var(--brand-gold);\n      background: var(--brand-gold-50);\n      border-radius: 0 12px 12px 0;\n      font-family: var(--font-bangla); font-size: 14px; font-style: italic;\n      line-height: 1.6; color: var(--fg-primary);\n    }\n    .pull-quote-attr {\n      display: block; margin-top: 8px;\n      font-family: var(--font-latin); font-size: 11px; font-style: normal;\n      color: var(--fg-tertiary); letter-spacing: 0.02em; text-transform: uppercase;\n    }\n\n    /* ============ INFO TABLE ============ */\n    .info-card {\n      background: var(--bg-surface); border-radius: 16px;\n      border: 1px solid var(--border-subtle);\n      overflow: hidden;\n    }\n    .info-row {\n      display: flex; align-items: center; gap: 12px;\n      padding: 12px 14px;\n      border-bottom: 1px solid var(--border-subtle);\n    }\n    .info-row:last-child { border-bottom: 0; }\n    .info-row .ic {\n      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;\n      background: var(--bg-surface-2); color: var(--fg-secondary);\n      display: inline-flex; align-items: center; justify-content: center;\n    }\n    .info-row .ic svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n    .info-row .lbl {\n      font-family: var(--font-bangla); font-size: 14px; color: var(--fg-secondary); flex: 1;\n    }\n    .info-row .val {\n      font-family: var(--font-bangla); font-size: 14px; font-weight: 600; color: var(--fg-primary);\n      display: inline-flex; align-items: center; gap: 6px;\n    }\n    .info-row .val.num { font-family: var(--font-latin); }\n    .pill {\n      display: inline-flex; align-items: center; gap: 4px;\n      padding: 2px 8px; border-radius: 999px;\n      font-family: var(--font-bangla); font-size: 11px; font-weight: 600;\n    }\n    .pill.yes { background: var(--success-tint); color: var(--success); }\n    .pill.partial { background: var(--warning-tint); color: var(--warning); }\n    .pill svg { stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }\n\n    /* ============ SIMILAR (h-scroll) ============ */\n    .h-scroll {\n      display: flex; gap: 12px; overflow-x: auto;\n      padding: 0 22px 6px; margin: 0 -22px;\n      scrollbar-width: none;\n    }\n    .h-scroll::-webkit-scrollbar { display: none; }\n    .scard {\n      flex: 0 0 168px; height: 200px; border-radius: 16px;\n      position: relative; overflow: hidden;\n      box-shadow: var(--shadow-sm);\n      cursor: pointer;\n    }\n    .scard .img { position: absolute; inset: 0; }\n    .scard .ovr {\n      position: absolute; inset: 0;\n      background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%);\n    }\n    .scard .meta {\n      position: absolute; left: 12px; right: 12px; bottom: 12px; color: #fff;\n    }\n    .scard .meta .when {\n      font-family: var(--font-latin); font-size: 10px; font-weight: 600;\n      letter-spacing: 0.10em; text-transform: uppercase; opacity: 0.85;\n    }\n    .scard .meta .nm {\n      font-family: var(--font-bangla); font-size: 16px; font-weight: 700;\n      margin-top: 3px; line-height: 1.2;\n      text-shadow: 0 1px 6px rgba(0,0,0,0.4);\n    }\n    .scard .meta .en {\n      font-family: var(--font-latin); font-size: 11px; opacity: 0.78; margin-top: 2px;\n    }\n    .scard .corner-pill {\n      position: absolute; top: 10px; left: 10px;\n      padding: 3px 7px; border-radius: 999px;\n      background: rgba(255,255,255,0.20); backdrop-filter: blur(8px);\n      font-family: var(--font-bangla); font-size: 10px; font-weight: 600; color: #fff;\n      border: 1px solid rgba(255,255,255,0.3);\n    }\n\n    /* card backgrounds (per holiday) */\n    .img-victory { background: radial-gradient(circle at 30% 30%, #C71F33, #6E1018 80%); }\n    .img-victory::after { content: \"\"; position: absolute; inset: 0;\n      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 12px, transparent 12px 24px); }\n    .img-indep   { background: radial-gradient(circle at 70% 30%, #008A66, #003B2C 80%); }\n    .img-indep::after { content: \"\"; position: absolute; inset: 0;\n      background: radial-gradient(circle at 30% 80%, rgba(212,175,55,0.30), transparent 50%); }\n    .img-language { background: linear-gradient(160deg, #2A2A28 0%, #1A1A18 100%); }\n    .img-language::after { content: \"\"; position: absolute; inset: 0;\n      background: radial-gradient(circle at 50% 35%, rgba(244,42,65,0.45), transparent 55%); }\n\n    /* tab bar (bottom safe spacer) */\n    .footer-fade {\n      position: absolute; left: 0; right: 0; bottom: 0; height: 80px;\n      background: linear-gradient(180deg, transparent, var(--bg-canvas) 60%);\n      pointer-events: none; z-index: 40;\n    }\n\n    /* DARK adjustments */\n    [data-theme=\"dark\"] .lede::first-letter { color: #FF6B7E; }\n    [data-theme=\"dark\"] .pull-quote { background: rgba(212,175,55,0.10); }\n  <\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"header\">\n  <div class=\"eyebrow\">BongoCal · Holiday Detail · পহেলা বৈশাখ<\u002Fdiv>\n  <h1 class=\"title\">Magazine-style holiday detail.<\u002Fh1>\n  <p class=\"sub\">Festival hero with alpana sun rays, 12-day countdown card, three-up actions, drop-cap article, info matrix, and a horizontal-scroll rail of related national days. Light + dark.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"row\" id=\"row\"><\u002Fdiv>\n\n<template id=\"page-tpl\">\n  <div class=\"hero\">\n    <div class=\"hero-illu\"><\u002Fdiv>\n    <!-- sun rays -->\n    <svg class=\"hero-rays\" width=\"380\" height=\"380\" viewBox=\"-190 -190 380 380\">\n      <g stroke=\"rgba(255,255,255,0.55)\" stroke-width=\"1.2\" stroke-linecap=\"round\" fill=\"none\">\n        <!-- 16 rays -->\n        <g id=\"rays\"><\u002Fg>\n      <\u002Fg>\n      <circle r=\"62\" fill=\"rgba(253,181,42,0.0)\" stroke=\"rgba(255,255,255,0.55)\" stroke-width=\"1.5\"><\u002Fcircle>\n      <circle r=\"48\" fill=\"rgba(255,255,255,0.0)\" stroke=\"rgba(255,255,255,0.35)\" stroke-width=\"1\"><\u002Fcircle>\n    <\u002Fsvg>\n    <!-- alpana petal motif -->\n    <svg class=\"hero-petals\" width=\"280\" height=\"280\" viewBox=\"-140 -140 280 280\">\n      <g fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\">\n        <g id=\"petals\"><\u002Fg>\n      <\u002Fg>\n    <\u002Fsvg>\n\n    <div class=\"statusbar\">\n      <span>9:41<\u002Fspan>\n      <span style=\"display:inline-flex;gap:6px;align-items:center\">\n        <svg width=\"16\" height=\"11\" viewBox=\"0 0 16 11\" fill=\"currentColor\"><rect x=\"0\" y=\"7\" width=\"3\" height=\"4\" rx=\"1\"><\u002Frect><rect x=\"4\" y=\"5\" width=\"3\" height=\"6\" rx=\"1\"><\u002Frect><rect x=\"8\" y=\"3\" width=\"3\" height=\"8\" rx=\"1\"><\u002Frect><rect x=\"12\" y=\"0\" width=\"3\" height=\"11\" rx=\"1\"><\u002Frect><\u002Fsvg>\n        <svg width=\"22\" height=\"11\" viewBox=\"0 0 22 11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"><rect x=\"0.5\" y=\"0.5\" width=\"18\" height=\"10\" rx=\"2.5\"><\u002Frect><rect x=\"2\" y=\"2\" width=\"13\" height=\"7\" rx=\"1.2\" fill=\"currentColor\"><\u002Frect><rect x=\"19.5\" y=\"3\" width=\"1.5\" height=\"5\" rx=\"0.5\" fill=\"currentColor\"><\u002Frect><\u002Fsvg>\n      <\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"hero-top\">\n      <button class=\"icon-btn\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <button class=\"icon-btn\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\"><path d=\"M5 12h.01M12 12h.01M19 12h.01\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"hero-foot\">\n      <span class=\"badge\"><span class=\"dot\"><\u002Fspan>জাতীয় দিবস · National Day<\u002Fspan>\n      <h1 class=\"h-name\">পহেলা বৈশাখ<\u002Fh1>\n      <div class=\"h-name-en\">Pohela Boishakh · Bengali New Year<\u002Fdiv>\n      <div class=\"h-dates\">\n        <div class=\"h-date-bn\">১ বৈশাখ ১৪৩৩<\u002Fdiv>\n        <div class=\"h-date-en\">April 14, 2026 · Tuesday<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- countdown -->\n  <div class=\"countdown\">\n    <div class=\"cd-pulse\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"cd-text\">\n      <div class=\"cd-num\">12<span class=\"unit\">দিন বাকি<\u002Fspan><\u002Fdiv>\n      <div class=\"cd-sub\">12 days · 4 hours · 23 minutes<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cd-progress\">\n      <svg viewBox=\"0 0 60 60\">\n        <circle class=\"track\" cx=\"30\" cy=\"30\" r=\"24\" fill=\"none\" stroke-width=\"5\"><\u002Fcircle>\n        <circle class=\"fill\" cx=\"30\" cy=\"30\" r=\"24\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div class=\"cd-progress-pct\">78%<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- actions -->\n  <div class=\"actions\">\n    <div class=\"action primary\">\n      <span class=\"ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\"><path d=\"M18 16v-5a6 6 0 1 0-12 0v5l-2 3h16zM10 19a2 2 0 0 0 4 0\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <span class=\"lbl\">রিমাইন্ডার<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"action\">\n      <span class=\"ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\"><path d=\"M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <span class=\"lbl\">শেয়ার করুন<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"action\">\n      <span class=\"ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\"><path d=\"M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <span class=\"lbl\">সংরক্ষণ<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- About -->\n  <div class=\"sec\">\n    <h2 class=\"sec-title\"><span class=\"accent\"><\u002Fspan>এই দিন সম্পর্কে<\u002Fh2>\n    <p class=\"lede\">পহেলা বৈশাখ বাঙালির সর্বজনীন উৎসব — নতুন বছরকে বরণ করে নেওয়ার দিন। লাল-সাদা পোশাকে রমনার বটমূলে শুরু হয় ছায়ানটের প্রভাতি অনুষ্ঠান, ঢাকা বিশ্ববিদ্যালয় থেকে বের হয় বিশাল মঙ্গল শোভাযাত্রা।<\u002Fp>\n    <p class=\"body-p\">পান্তা-ইলিশ, মিষ্টি, এবং নতুন হালখাতায় ব্যবসায়ীরা শুভেচ্ছা বিনিময় করেন। গ্রামে বসে বৈশাখী মেলা — কাঠের পুতুল, মাটির হাঁড়ি, নাগরদোলা আর বাউল গানে ভরে ওঠে প্রাঙ্গণ।<\u002Fp>\n    <div class=\"pull-quote\">\n      \"এসো হে বৈশাখ, এসো এসো\" — পুরাতনকে মুছে নতুনের আবাহনে এই দিন বাঙালির আত্মপরিচয়ের প্রতীক হয়ে উঠেছে।\n      <span class=\"pull-quote-attr\">— Cultural significance · UNESCO 2016<\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"body-p\">১৫৮৪ সালে সম্রাট আকবর কর্তৃক বাংলা সন প্রবর্তিত হলেও আধুনিক রূপে পহেলা বৈশাখ উদযাপন শুরু হয় ১৯৬৫ সালে, ছায়ানটের রমনা বটমূল অনুষ্ঠানের মাধ্যমে। ১৯৮৯ সাল থেকে চারুকলা অনুষদের মঙ্গল শোভাযাত্রা শুরু হয় — যা ২০১৬ সালে UNESCO-র Intangible Cultural Heritage তালিকায় স্থান পায়।<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- Info -->\n  <div class=\"sec\">\n    <h2 class=\"sec-title\"><span class=\"accent\"><\u002Fspan>প্রয়োজনীয় তথ্য<\u002Fh2>\n    <div class=\"info-card\">\n      <div class=\"info-row\">\n        <span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M3 9h18M8 3v4M16 3v4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"lbl\">সরকারি ছুটি<\u002Fspan>\n        <span class=\"val\"><span class=\"pill yes\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg>হ্যাঁ<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"info-row\">\n        <span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\"><path d=\"M3 21h18M5 21V8l7-5 7 5v13M9 9h.01M15 9h.01M9 13h.01M15 13h.01M9 17h.01M15 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"lbl\">ব্যাংক বন্ধ<\u002Fspan>\n        <span class=\"val\"><span class=\"pill yes\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\"><path d=\"M5 12l4 4L19 6\"><\u002Fpath><\u002Fsvg>হ্যাঁ<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"info-row\">\n        <span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\"><path d=\"M3 17h2l1 4h12l1-4h2M5 17V8a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v9M3 12h18\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"lbl\">পাবলিক ট্রান্সপোর্ট<\u002Fspan>\n        <span class=\"val\"><span class=\"pill partial\">সীমিত<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"info-row\">\n        <span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\"><path d=\"M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"lbl\">প্রথম পালিত<\u002Fspan>\n        <span class=\"val num\">1965<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"info-row\">\n        <span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M2 12h20M12 2c3 3 4.5 6 4.5 10s-1.5 7-4.5 10c-3-3-4.5-6-4.5-10s1.5-7 4.5-10z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"lbl\">পালিত হয়<\u002Fspan>\n        <span class=\"val\">বাংলাদেশ · পশ্চিমবঙ্গ<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Similar -->\n  <div class=\"sec\">\n    <h2 class=\"sec-title\"><span class=\"accent\"><\u002Fspan>অন্যান্য জাতীয় দিবস<\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"h-scroll\">\n    <div class=\"scard\">\n      <div class=\"img img-language\"><\u002Fdiv>\n      <span class=\"corner-pill\">ফেব্রুয়ারি<\u002Fspan>\n      <div class=\"ovr\"><\u002Fdiv>\n      <div class=\"meta\">\n        <div class=\"when\">FEB 21 · ৮ ফাল্গুন<\u002Fdiv>\n        <div class=\"nm\">শহীদ দিবস<\u002Fdiv>\n        <div class=\"en\">International Mother Language Day<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"scard\">\n      <div class=\"img img-indep\"><\u002Fdiv>\n      <span class=\"corner-pill\">মার্চ<\u002Fspan>\n      <div class=\"ovr\"><\u002Fdiv>\n      <div class=\"meta\">\n        <div class=\"when\">MAR 26 · ১২ চৈত্র<\u002Fdiv>\n        <div class=\"nm\">স্বাধীনতা দিবস<\u002Fdiv>\n        <div class=\"en\">Independence Day<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"scard\">\n      <div class=\"img img-victory\"><\u002Fdiv>\n      <span class=\"corner-pill\">ডিসেম্বর<\u002Fspan>\n      <div class=\"ovr\"><\u002Fdiv>\n      <div class=\"meta\">\n        <div class=\"when\">DEC 16 · ১ পৌষ<\u002Fdiv>\n        <div class=\"nm\">বিজয় দিবস<\u002Fdiv>\n        <div class=\"en\">Victory Day<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 24px;\"><\u002Fdiv>\n<\u002Ftemplate>\n\n<script>\n  // generate sun-ray and petal SVG paths\n  function build(theme) {\n    const stage = document.createElement('div');\n    stage.className = 'stage';\n    const dev = document.createElement('div');\n    dev.className = 'device' + (theme === 'dark' ? ' dark' : '');\n    dev.setAttribute('data-theme', theme);\n    dev.innerHTML = `\n      <div class=\"island\"><\u002Fdiv>\n      <div class=\"scroll\">${document.getElementById('page-tpl').innerHTML}<\u002Fdiv>\n      <div class=\"footer-fade\"><\u002Fdiv>\n      <div class=\"home-bar\"><\u002Fdiv>\n    `;\n    stage.appendChild(dev);\n    const lbl = document.createElement('div');\n    lbl.className = 'label';\n    lbl.textContent = theme === 'dark' ? 'Dark · Holiday detail' : 'Light · Holiday detail';\n    stage.appendChild(lbl);\n\n    // populate sun rays\n    const rays = stage.querySelector('#rays');\n    if (rays) {\n      for (let i = 0; i < 24; i++) {\n        const a = (i / 24) * Math.PI * 2;\n        const r1 = 70, r2 = i % 2 === 0 ? 130 : 110;\n        const x1 = Math.cos(a) * r1, y1 = Math.sin(a) * r1;\n        const x2 = Math.cos(a) * r2, y2 = Math.sin(a) * r2;\n        const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');\n        ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);\n        ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);\n        rays.appendChild(ln);\n      }\n    }\n    // alpana petals (8 lobed)\n    const petals = stage.querySelector('#petals');\n    if (petals) {\n      for (let i = 0; i < 8; i++) {\n        const a = (i / 8) * 360;\n        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');\n        p.setAttribute('d', 'M0,0 C 30,-20 60,-20 90,0 C 60,20 30,20 0,0 Z');\n        p.setAttribute('transform', `rotate(${a})`);\n        petals.appendChild(p);\n      }\n      // inner ring of 8\n      for (let i = 0; i < 8; i++) {\n        const a = ((i + 0.5) / 8) * 360;\n        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');\n        p.setAttribute('d', 'M0,0 C 18,-10 38,-10 56,0 C 38,10 18,10 0,0 Z');\n        p.setAttribute('transform', `rotate(${a})`);\n        petals.appendChild(p);\n      }\n    }\n    return stage;\n  }\n  const row = document.getElementById('row');\n  row.appendChild(build('light'));\n  row.appendChild(build('dark'));\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
