<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  body { font-family: var(--font-bangla); padding: 20px; }
  .device { width: 320px; border-radius: 24px; background: var(--bg-surface); border: 1px solid var(--border-subtle); overflow: hidden; box-shadow: 0 2px 4px rgba(20,20,19,.05), 0 8px 20px rgba(20,20,19,.10); }
  .appbar { height: 56px; padding: 0 16px; display:flex; align-items:center; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); }
  .title { font-size: 20px; font-weight: 700; color: var(--fg-primary); letter-spacing: -0.005em; }
  .subtitle { font-family: var(--font-latin); font-size: 11px; color: var(--fg-tertiary); margin-top: 1px; }
  .acts { display:flex; gap: 8px; color: var(--fg-secondary); }
  .body-fill { padding: 24px 16px; color: var(--fg-tertiary); font-size: 12px; }
  .navbar { height: 64px; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border-subtle); background: var(--bg-surface); }
  .nav-item { display:flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--fg-tertiary); font-size: 10px; font-weight: 500; }
  .nav-item.active { color: var(--brand-emerald); }
  svg { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke: currentColor; }
</style></head>
<body>
  <p class="lbl">Top app bar &amp; bottom nav</p>
  <div class="device">
    <div class="appbar">
      <div>
        <div class="title">এপ্রিল</div>
        <div class="subtitle">১৪৩২ বঙ্গাব্দ · ১৪৪৭ হিজরি</div>
      </div>
      <div class="acts">
        <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/></svg>
      </div>
    </div>
    <div class="body-fill">— content area —</div>
    <div class="navbar">
      <div class="nav-item active">
        <svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        ক্যালেন্ডার
      </div>
      <div class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>
        অনুষ্ঠান
      </div>
      <div class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1L12 16.6 5.7 21l2.3-7.1L2 9.4h7.6z"/></svg>
        উৎসব
      </div>
      <div class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.4 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.4 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.4-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.4-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.4H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.4l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.4 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        সেটিংস
      </div>
    </div>
  </div>
</body></html>
