<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  body { font-family: var(--font-bangla); }
  .row { display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { font-family: var(--font-bangla); font-weight:600; font-size: 15px; height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: all 120ms cubic-bezier(.2,0,0,1); display: inline-flex; align-items: center; gap: 8px; }
  .btn:active { transform: scale(0.97); transition-duration: 80ms; }
  .btn-primary { background: var(--brand-emerald); color: #fff; }
  .btn-primary:hover { background: var(--brand-emerald-700); }
  .btn-secondary { background: var(--bg-surface); color: var(--fg-primary); border-color: var(--border-default); }
  .btn-secondary:hover { background: var(--bg-surface-2); }
  .btn-ghost { background: transparent; color: var(--brand-emerald); }
  .btn-ghost:hover { background: var(--brand-emerald-50); }
  .btn-destructive { background: var(--brand-red); color: #fff; }
  .btn-destructive:hover { background: var(--brand-red-700); }
  .btn-icon { width: 44px; height: 44px; padding: 0; justify-content: center; background: var(--bg-surface); border: 1px solid var(--border-default); color: var(--fg-primary); }
  .btn-icon:hover { background: var(--bg-surface-2); }
</style></head>
<body>
  <p class="lbl">Buttons</p>
  <div class="row">
    <button class="btn btn-primary">নতুন অনুষ্ঠান</button>
    <button class="btn btn-secondary">বাতিল</button>
    <button class="btn btn-ghost">আরও দেখুন</button>
    <button class="btn btn-destructive">মুছুন</button>
    <button class="btn btn-icon" aria-label="add">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <p class="lbl" style="margin-top: 16px">Disabled · Pressed · Loading</p>
  <div class="row">
    <button class="btn btn-primary" style="opacity: 0.4; cursor: not-allowed">নতুন অনুষ্ঠান</button>
    <button class="btn btn-primary" style="background: var(--brand-emerald-700); transform: scale(0.97)">চাপা</button>
    <button class="btn btn-primary"><span style="display:inline-block; width:14px; height:14px; border:2px solid #ffffff66; border-top-color:#fff; border-radius:50%; animation: sp 800ms linear infinite"></span>সংরক্ষণ…</button>
  </div>
  <style>@keyframes sp { to { transform: rotate(360deg); } }</style>
</body></html>
