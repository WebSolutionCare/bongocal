<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  body { font-family: var(--font-bangla); }
  .stack { display: flex; flex-direction: column; gap: 12px; max-width: 360px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .lbl2 { font-size: 12px; font-weight: 600; color: var(--fg-secondary); }
  .input { height: 44px; border-radius: 10px; border: 1px solid var(--border-default); background: var(--bg-surface); padding: 0 14px; font: inherit; font-size: 15px; color: var(--fg-primary); transition: border-color 120ms; }
  .input:focus { outline: none; border-color: var(--brand-emerald); box-shadow: 0 0 0 3px var(--brand-emerald-50); }
  .input.error { border-color: var(--error); }
  .err { font-size: 12px; color: var(--error); }
  .help { font-size: 12px; color: var(--fg-tertiary); }
  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--fg-tertiary); }
  .search .input { padding-left: 38px; }
</style></head>
<body>
  <p class="lbl">Inputs</p>
  <div class="stack">
    <div class="field">
      <div class="lbl2">অনুষ্ঠানের নাম</div>
      <input class="input" value="পরিবারের ইফতার">
      <div class="help">৫০ অক্ষরের মধ্যে রাখুন</div>
    </div>
    <div class="field">
      <div class="lbl2">তারিখ</div>
      <input class="input" placeholder="তারিখ নির্বাচন করুন">
    </div>
    <div class="field search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="input" placeholder="অনুষ্ঠান খুঁজুন…">
    </div>
    <div class="field">
      <div class="lbl2">ইমেইল</div>
      <input class="input error" value="user@">
      <div class="err">সঠিক ইমেইল ঠিকানা দিন</div>
    </div>
  </div>
</body></html>
