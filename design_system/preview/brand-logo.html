<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 20px; display:flex; gap: 16px; align-items: center; }
  .mark { width: 88px; height: 88px; }
  .desc { font-family: var(--font-latin); }
  .h { font-size: 22px; font-weight: 700; color: var(--fg-primary); letter-spacing: -0.01em; }
  .sub { font-size: 13px; color: var(--fg-tertiary); margin-top: 6px; max-width: 380px; line-height: 1.5; }
  .tag { display:inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 999px; background: var(--brand-emerald-50); color: var(--brand-emerald); font-size: 11px; font-weight: 600; }
</style></head>
<body>
  <img class="mark" src="../assets/logo.svg" alt="BongoCal">
  <div class="desc">
    <div class="h">BongoCal</div>
    <div class="sub">A Bengali <b>ক</b> glyph reconstructed inside a calendar binding, with a warm-red today-dot at the corner. Used at 64+ in product, 32 for app icon, 16 for inline mentions.</div>
    <span class="tag">Brand mark</span>
  </div>
</body></html>
