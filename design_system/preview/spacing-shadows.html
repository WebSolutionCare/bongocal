<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 20px; padding: 24px 12px; }
  .item { flex:1; display:flex; flex-direction:column; align-items:center; gap: 10px; }
  .box { width: 120px; height: 80px; background: var(--bg-surface); border-radius: 12px; }
  .nm { font-size:12px; font-weight: 600; color: var(--fg-primary); }
  .lab { font-size:11px; color: var(--fg-tertiary); font-family: ui-monospace, monospace; text-align: center; }
</style></head>
<body>
  <p class="lbl">Elevation · 4 levels</p>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow: 0 1px 2px rgba(20,20,19, 0.05)"></div><div class="nm">xs</div><div class="lab">resting<br>cards</div></div>
    <div class="item"><div class="box" style="box-shadow: 0 1px 2px rgba(20,20,19,.04), 0 2px 6px rgba(20,20,19,.06)"></div><div class="nm">sm</div><div class="lab">elevated<br>cards</div></div>
    <div class="item"><div class="box" style="box-shadow: 0 2px 4px rgba(20,20,19,.05), 0 8px 20px rgba(20,20,19,.10)"></div><div class="nm">md</div><div class="lab">popovers<br>menus</div></div>
    <div class="item"><div class="box" style="box-shadow: 0 4px 8px rgba(20,20,19,.06), 0 18px 40px rgba(20,20,19,.16)"></div><div class="nm">lg</div><div class="lab">sheets<br>modals</div></div>
  </div>
</body></html>
