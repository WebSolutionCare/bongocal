<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  body { font-family: var(--font-bangla); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(20,20,19,.04), 0 2px 6px rgba(20,20,19,.06); }
  .today { background: linear-gradient(135deg, #006A4E 0%, #005A42 100%); color: #fff; border-color: transparent; }
  .today .day { font-family: var(--font-latin); font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
  .today .month { font-size: 14px; opacity: 0.85; margin-top: 6px; }
  .today .ev { font-size: 13px; opacity: 0.85; margin-top: 12px; }
  .holiday-bar { width: 4px; align-self: stretch; background: var(--brand-red); border-radius: 999px; margin-right: 12px; }
  .row-card { display:flex; align-items: stretch; }
  .h3 { font-size: 16px; font-weight: 600; color: var(--fg-primary); }
  .meta { font-size: 12px; color: var(--fg-tertiary); margin-top: 4px; }
  .event-row { display:flex; align-items: center; gap: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--brand-emerald); flex-shrink: 0; }
  .time { font-family: var(--font-latin); font-size:12px; font-variant-numeric: tabular-nums; color: var(--fg-tertiary); margin-left: auto; }
</style></head>
<body>
  <p class="lbl">Cards</p>
  <div class="grid">
    <div class="card today">
      <div class="day">27</div>
      <div class="month">এপ্রিল · ১৪ বৈশাখ</div>
      <div class="ev">৩টি অনুষ্ঠান আজ</div>
    </div>
    <div class="card row-card">
      <div class="holiday-bar"></div>
      <div>
        <div class="h3">পহেলা বৈশাখ</div>
        <div class="meta">সরকারি ছুটি · ১ বৈশাখ</div>
      </div>
    </div>
    <div class="card" style="grid-column: span 2">
      <div class="event-row">
        <div class="dot"></div>
        <div>
          <div class="h3" style="font-size:14px">টিম মিটিং</div>
          <div class="meta">অফিস · বনানী</div>
        </div>
        <div class="time">10:00 – 11:00</div>
      </div>
    </div>
  </div>
</body></html>
