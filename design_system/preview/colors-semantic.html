<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body>
  <p class="lbl">Semantic · Status</p>
  <div class="card-row">
    <div class="swatch"><div class="chip" style="background:#1F8A4C"></div><div class="name">Success</div><div class="val">#1F8A4C</div></div>
    <div class="swatch"><div class="chip" style="background:#DBEFE2; border-color:#1F8A4C33"></div><div class="name">Success tint</div><div class="val">#DBEFE2</div></div>
    <div class="swatch"><div class="chip" style="background:#C97A11"></div><div class="name">Warning</div><div class="val">#C97A11</div></div>
    <div class="swatch"><div class="chip" style="background:#FAEBCD; border-color:#C97A1133"></div><div class="name">Warning tint</div><div class="val">#FAEBCD</div></div>
    <div class="swatch"><div class="chip" style="background:#D02D2D"></div><div class="name">Error</div><div class="val">#D02D2D</div></div>
    <div class="swatch"><div class="chip" style="background:#F9DCDC; border-color:#D02D2D33"></div><div class="name">Error tint</div><div class="val">#F9DCDC</div></div>
    <div class="swatch"><div class="chip" style="background:#1E6FBE"></div><div class="name">Info</div><div class="val">#1E6FBE</div></div>
    <div class="swatch"><div class="chip" style="background:#DDEAF8; border-color:#1E6FBE33"></div><div class="name">Info tint</div><div class="val">#DDEAF8</div></div>
  </div>
</body></html>
