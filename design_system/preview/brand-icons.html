<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  body { font-family: var(--font-latin); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .ic { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--fg-secondary); }
  .ic svg { color: var(--fg-primary); }
  .nm { font-size: 11px; font-weight: 600; color: var(--fg-primary); }
  .ln { font-size: 10px; font-family: ui-monospace, monospace; color: var(--fg-tertiary); }
  svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
  <p class="lbl">Iconography · Lucide outline · 1.5px</p>
  <div class="grid">
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><div class="nm">Calendar</div><div class="ln">calendar</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2l2 6h6l-5 3.6 2 6.4-5-3.6-5 3.6 2-6.4L4 8h6z"/></svg><div class="nm">Festival</div><div class="ln">sparkles</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/></svg><div class="nm">Notify</div><div class="ln">bell</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1l2.1-2.1M17 7l2.1-2.1"/></svg><div class="nm">Settings</div><div class="ln">settings</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><div class="nm">Add</div><div class="ln">plus</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><div class="nm">Search</div><div class="ln">search</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><div class="nm">Bengali</div><div class="ln">sun</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><div class="nm">Hijri</div><div class="ln">moon</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg><div class="nm">Gregorian</div><div class="ln">globe</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><div class="nm">Back</div><div class="ln">chevron-left</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><div class="nm">More</div><div class="ln">more-horiz</div></div>
    <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/><circle cx="12" cy="12" r="3"/></svg><div class="nm">Today</div><div class="ln">cal-clock</div></div>
  </div>
</body></html>
